<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FIFOWA ŚPODA</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fffbeb; /* Twój kremowy z var(--cream-bg) */
    }

    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .fifa-loader {
      position: relative;
      width: 65px;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .xbox-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 5px solid transparent;
      border-top-color: #33291F;
      border-right-color: rgba(51, 41, 31, 0.3);
      border-bottom-color: rgba(51, 41, 31, 0.1);
      border-radius: 50%;
      animation: xbox-spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 12px rgba(51, 41, 31, 0.25);
    }

    .loader-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      animation: logo-pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes xbox-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes logo-pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
<app-root>
  <div class="splash-screen">
    <div class="fifa-loader">
      <div class="xbox-ring"></div>
      <img src="logo.png" alt="Ładowanie..." class="loader-logo" width="45" height="45">
    </div>
  </div>
</app-root>
</body>
</html>
