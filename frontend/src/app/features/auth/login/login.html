<div class="login-page">
  <div class="login-card animate-in">

    <div class="login-header">
      <!-- Wysokość kontrolowana z poziomu SCSS, by nie psuć mobilek -->
      <img src="/logo.png" alt="Logo" class="login-logo">
      <p>Witamy oficjalnie!</p>
    </div>

    <div class="tabs">
      <button
        type="button"
        [class.active]="activeTab === 'login'"
        (click)="activeTab = 'login'">
        Zaloguj
      </button>
      <button
        type="button"
        [class.active]="activeTab === 'guest'"
        (click)="activeTab = 'guest'">
        Śledź wyniki
      </button>
    </div>

    <!-- NOWE: Kontener trzymający stałą wysokość dla obu zakładek -->
    <div class="tab-content">
      <form *ngIf="activeTab === 'login'" (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="input-group">
          <label for="email">E-mail / Login</label>
          <div class="input-wrapper">
            <span class="icon">👤</span>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="credentials.login"
              placeholder="Twój adres e-mail"
              required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Hasło</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="credentials.password"
              placeholder="••••••••"
              required>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="!loginForm.valid">
          Zaloguj się
        </button>
      </form>

      <div class="guest-section" *ngIf="activeTab === 'guest'">
        <div class="input-group">
          <label for="leagueCode">Kod ligi</label>
          <div class="input-wrapper">
            <span class="icon">🏆</span>
            <input
              type="text"
              id="leagueCode"
              maxlength="7"
              placeholder="Podaj 7-znakowy kod ligi"
              [(ngModel)]="publicLeagueCode"
              (keyup.enter)="enterAsGuest()"
              autofocus>
          </div>
        </div>

        <button class="btn-primary" (click)="enterAsGuest()" [disabled]="!publicLeagueCode.trim()">
          Śledź wyniki na żywo
        </button>
      </div>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 ŚPODA•FC</p>
    </div>

  </div>
</div>
