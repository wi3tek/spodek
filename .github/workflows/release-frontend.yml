name: Frontend Release (Render)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Rodzaj aktualizacji PWA (MAJOR/MINOR/PATCH)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Podbicie wersji z głównego pliku
        run: |
          OLD_VERSION=$(cat app-version.txt)
          NEW_VERSION=$(npx semver -i ${{ github.event.inputs.bump_type }} $OLD_VERSION)
          
          echo $NEW_VERSION > app-version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Wstrzyknięcie wersji do PWA
        run: |
          jq --arg v "${{ env.NEW_VERSION }}" '.appData.version = $v' ./frontend/ngsw-config.json > tmp.json
          mv tmp.json ./frontend/ngsw-config.json

      - name: Commit i Tag
        run: |
          git add app-version.txt ./frontend/ngsw-config.json
          git commit -m "frontend-v${{ env.NEW_VERSION }}"
          git tag "frontend-v${{ env.NEW_VERSION }}"
          git push origin HEAD --follow-tags

      - name: Uruchomienie wdrożenia i oczekiwanie na wynik (Polling)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 Rozpoczynam wdrożenie na Renderze..."
          
          TRIGGER_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          DEPLOY_ID=$(echo "$TRIGGER_RESPONSE" | jq -r '.id')
          
          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Błąd wyzwalania wdrożenia. Odpowiedź serwera: $TRIGGER_RESPONSE"
            exit 1
          fi
          
          echo "✅ Wdrożenie wystartowało. ID zadania: $DEPLOY_ID"
          echo "⏳ Czekam na zakończenie budowania..."
          
          while true; do
            STATUS_RESPONSE=$(curl -s -X GET \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY")
          
            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')
          
            if [ "$STATUS" = "live" ]; then
              echo "🎉 Wdrożenie zakończone sukcesem!"
              exit 0
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "update_failed" ]; then
              echo "❌ Wdrożenie zakończyło się błędem: $STATUS"
              exit 1
            fi
          
            echo "Obecny status: $STATUS... (sprawdzam ponownie za 15 sekund)"
            sleep 15
          done

      - name: Link do logów na Renderze
        if: always()
        run: |
          echo "Pełne logi z procesu budowania znajdziesz pod tym adresem:"
          echo "👉 https://dashboard.render.com/web/${{ secrets.RENDER_SERVICE_ID }}/logs"