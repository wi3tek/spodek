name: Podbij globalną wersję i wdróż na Railway

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Wybierz rodzaj aktualizacji (MAJOR/MINOR/PATCH)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Konfiguracja bota Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Obliczenie nowej wersji (Globalnie)
        # Podbija wersję w głównym package.json, ale jeszcze nie robi commita (--no-git-tag-version)
        run: npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version

      - name: Zapisanie nowej wersji do zmiennej
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Wstrzyknięcie wersji do PWA (Zastępuje set-pwa-version.js)
        # Narzędzie 'jq' otwiera ngsw-config.json, ustawia appData.version na naszą nową wersję z pamięci i nadpisuje plik
        run: |
          jq --arg v "${{ env.NEW_VERSION }}" '.appData.version = $v' ./frontend/ngsw-config.json > tmp.json
          mv tmp.json ./frontend/ngsw-config.json

      - name: Commit, Tag i Push
        # Ręcznie tworzymy jeden, czysty commit zawierający zmianę wersji i konfiguracji PWA
        run: |
          git add package.json ./frontend/ngsw-config.json
          git commit -m "v${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"
          git push origin HEAD --follow-tags

      - name: Instalacja Railway CLI
        run: npm i -g @railway/cli
        
      - name: Publikacja na Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Wypycha gotowe, zaktualizowane pliki z serwera GitHuba prosto na Railway
        run: railway up --detach
