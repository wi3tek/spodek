name: Śpoda CI/CD (Release Version) 🚀

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Rodzaj aktualizacji (MAJOR/MINOR/PATCH)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      changelog:
        description: 'Co nowego? (zostaw puste dla domyślnego)'
        required: false
        type: string

jobs:
  # ==========================================
  # ZADANIE 1: WYKRYWANIE ZMIAN
  # ==========================================
  detect-changes:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '🚀 release:')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: 'backend/**'
            frontend: 'frontend/**'

  # ==========================================
  # ZADANIE 2: PRZYGOTOWANIE WERSJI I COMMIT
  # ==========================================
  prepare-release:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPODA_ADMIN_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Konfiguracja Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Ustalenie parametrów podbicia
        id: setup_vars
        run: |
          BUMP="${{ github.event.inputs.bump_type || 'patch' }}"
          CHANGE="${{ github.event.inputs.changelog || 'Automatyczna aktualizacja CI/CD' }}"
          
          echo "BUMP_TYPE=$BUMP" >> $GITHUB_ENV
          CHANGE_CLEAN=$(echo "$CHANGE" | tr '\n' ' ')
          echo "CHANGELOG=$CHANGE_CLEAN" >> $GITHUB_ENV

      - name: Wyliczenie nowej wersji globalnej
        id: prep
        run: |
          OLD_VERSION=$(cat app-version.txt)
          NEW_VERSION=$(npx semver -i ${{ env.BUMP_TYPE }} $OLD_VERSION)
          
          echo $NEW_VERSION > app-version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Aktualizacja tytułu w GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_TITLE=$(echo "${CHANGELOG}" | cut -c 1-80)
          # Dynamiczny przedrostek środowiska w nazwie
          ENV_PREFIX="${{ github.event_name == 'workflow_dispatch' && 'PROD' || 'TEST' }}"
          
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            -f name="🚀 [${ENV_PREFIX}] v${NEW_VERSION} - ${SHORT_TITLE}"

      - name: Sync wersji -> Backend (pom.xml)
        working-directory: ./backend
        run: mvn versions:set -DnewVersion=${{ env.NEW_VERSION }} -DgenerateBackupPoms=false

      - name: Sync wersji -> Frontend (package.json)
        working-directory: ./frontend
        run: npm version ${{ env.NEW_VERSION }} --no-git-tag-version

      - name: Aktualizacja PWA (ngsw-config.json)
        if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          jq --arg v "${{ env.NEW_VERSION }}" --arg c "${{ env.CHANGELOG }}" '.appData.version = $v | .appData.changelog = $c' ./frontend/ngsw-config.json > tmp.json
          mv tmp.json ./frontend/ngsw-config.json

      - name: Commit i Tag
        run: |
          git add app-version.txt
          git add ./backend/pom.xml || true
          git add ./frontend/package.json || true
          git add ./frontend/package-lock.json || true
          git add ./frontend/ngsw-config.json || true
          
          git commit -m "🚀 release: v${{ env.NEW_VERSION }} [skip ci]" -m "${{ env.CHANGELOG }}"
          
          git tag "v${{ env.NEW_VERSION }}"
          git push origin HEAD
          git push origin "v${{ env.NEW_VERSION }}"

  # ==========================================
  # ZADANIE 3: WDROŻENIE BACKENDU (DYNAMICZNE)
  # ==========================================
  deploy-backend:
    needs: [detect-changes, prepare-release]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.deploy.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare-release.outputs.new_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalacja Railway CLI
        run: npm i -g @railway/cli
      - name: Uruchomienie wdrożenia Railway i oczekiwanie na wynik
        id: deploy
        working-directory: ./backend
        env:
          # MAGIA DECZYJNA: Push na Main = Token Testowy | Ręczny przycisk = Token Produkcyjny
          RAILWAY_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_TEST_TOKEN }}
        run: |
          echo "🚀 Rozpoczynam wdrożenie na Railway..."
          rm -f /tmp/railway_pipe && mkfifo /tmp/railway_pipe
          date > .railway-force-deploy.txt
          railway up --service fifowa-spoda-backend > /tmp/railway_pipe 2>&1 &
          RAILWAY_PID=$!
          
          SKIPPED=false
          while read -r line; do
            echo "$line"
            if [[ "$line" == *"No changes to watched files"* ]] || [[ "$line" == *"no changes detected in watch paths"* ]] || [[ "$line" == *"build will skip"* ]]; then
              echo "⚠️ Wykryto brak zmian! Przerywam zawieszone CLI."
              echo "skipped=true" >> $GITHUB_OUTPUT
              SKIPPED=true
              kill -9 $RAILWAY_PID 2>/dev/null || true
              break
            fi
          done < /tmp/railway_pipe
          
          rm -f /tmp/railway_pipe
          if [ "$SKIPPED" = "true" ]; then exit 0; fi
          wait $RAILWAY_PID
          if [ $? -ne 0 ]; then exit 1; fi

  # ==========================================
  # ZADANIE 4: WDROŻENIE FRONTENDU (DYNAMICZNE)
  # ==========================================
  deploy-frontend:
    needs: [detect-changes, prepare-release]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      render_url: ${{ steps.deploy.outputs.render_url }}
    steps:
      - name: Uruchomienie wdrożenia i oczekiwanie na wynik (Polling)
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # MAGIA DECZYJNA: Push = ID Testowe | Ręczny = ID Produkcyjne
          RENDER_SERVICE_ID: ${{ github.event_name == 'workflow_dispatch' && vars.RENDER_PROD_SERVICE_ID || vars.RENDER_TEST_SERVICE_ID }}
        run: |
          echo "🚀 Rozpoczynam wdrożenie na serwer..."
          TRIGGER_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          DEPLOY_ID=$(echo "$TRIGGER_RESPONSE" | jq -r '.id')
          echo "render_url=https://dashboard.render.com/static/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" >> $GITHUB_OUTPUT
          
          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then exit 1; fi
          
          echo "✅ Wdrożenie wystartowało. ID zadania: $DEPLOY_ID"
          
          while true; do
            STATUS_RESPONSE=$(curl -s -X GET \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY")
            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')
          
            if [ "$STATUS" = "live" ]; then exit 0;
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "update_failed" ]; then exit 1; fi
            sleep 10
          done

  # ==========================================
  # ZADANIE 5: WSPÓLNE PODSUMOWANIE WYNIKÓW
  # ==========================================
  summary:
    needs: [ detect-changes, prepare-release, deploy-backend, deploy-frontend ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generowanie raportu końcowego
        run: |
          VERSION="v${{ needs.prepare-release.outputs.new_version }}"
          if [ "$VERSION" = "v" ]; then VERSION="(Brak nowej wersji)"; fi
          
          ENV_NAME="${{ github.event_name == 'workflow_dispatch' && 'PRODUKCJA' || 'TEST' }}"
          RAILWAY_PROJECT="${{ github.event_name == 'workflow_dispatch' && vars.RAILWAY_PROD_PROJECT_ID || vars.RAILWAY_TEST_PROJECT_ID }}"

          if [ "${{ needs.deploy-backend.result }}" = "skipped" ] && [ "${{ needs.deploy-frontend.result }}" = "skipped" ]; then
            echo "### Wynik wdrożenia $VERSION ($ENV_NAME) 🚀" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Instalacja pominięta** --> Zmiany dotyczyły wyłącznie plików poza głównymi katalogami." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          BACKEND_ICON="❌"
          BACKEND_URL="https://railway.com/project/${RAILWAY_PROJECT}/logs"
          BACKEND_DESC="[Przejdź do logów Railway]($BACKEND_URL)"
          
          if [ "${{ needs.deploy-backend.result }}" = "skipped" ] || [ "${{ needs.deploy-backend.outputs.skipped }}" = "true" ]; then
            BACKEND_ICON="⚠️"
            BACKEND_DESC="Pominięto (Brak zmian w backendzie)"
          elif [ "${{ needs.deploy-backend.result }}" = "success" ]; then 
            BACKEND_ICON="✅"
          fi
          
          FRONTEND_ICON="❌"
          FRONTEND_DESC="[Przejdź do logów Rendera](${{ needs.deploy-frontend.outputs.render_url }})"
          
          if [ "${{ needs.deploy-frontend.result }}" = "skipped" ]; then
            FRONTEND_ICON="⚠️"
            FRONTEND_DESC="Pominięto (Brak zmian we frontendzie)"
          elif [ "${{ needs.deploy-frontend.result }}" = "success" ]; then 
            FRONTEND_ICON="✅"
          fi
          
          echo "### Wynik wdrożenia $VERSION ($ENV_NAME) 🚀" >> $GITHUB_STEP_SUMMARY
          echo "$BACKEND_ICON **deploy - backend** --> $BACKEND_DESC" >> $GITHUB_STEP_SUMMARY
          echo "$FRONTEND_ICON **deploy - frontend** --> $FRONTEND_DESC" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BACKEND_ICON" = "❌" ] || [ "$FRONTEND_ICON" = "❌" ]; then
            echo "❌ Przynajmniej jedno wdrożenie się nie powiodło."
            exit 1
          fi