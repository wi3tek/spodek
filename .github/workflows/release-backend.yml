name: Backend Release (Railway)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Rodzaj aktualizacji API (MAJOR/MINOR/PATCH)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # --- 1. PRZYGOTOWANIE WERSJI ---
      - name: Podbicie wersji z głównego pliku
        run: |
          OLD_VERSION=$(cat app-version.txt)
          NEW_VERSION=$(npx semver -i ${{ github.event.inputs.bump_type }} $OLD_VERSION)
          
          echo $NEW_VERSION > app-version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit i Tag
        run: |
          git add app-version.txt
          git commit -m "backend-v${{ env.NEW_VERSION }}"
          git tag "backend-v${{ env.NEW_VERSION }}"
          git push origin HEAD --follow-tags

      # --- 2. WDROŻENIE (RAILWAY) ---
      - name: Instalacja Railway CLI
        run: npm i -g @railway/cli

      - name: Uruchomienie wdrożenia Railway i oczekiwanie na wynik
        id: deploy
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Rozpoczynam wdrożenie na Railway..."
          
          # Tworzymy potok w systemowym folderze tymczasowym
          rm -f /tmp/railway_pipe && mkfifo /tmp/railway_pipe
          
          # 🚨 DODAJ TĘ LINIJKĘ - Wymusza zmianę w katalogu ./backend 
          date > .railway-force-deploy.txt
          
          # Uruchamiamy CLI w tle i kierujemy logi do potoku
          railway up --service fifowa-spoda-backend > /tmp/railway_pipe 2>&1 &
          RAILWAY_PID=$!
          
          SKIPPED=false
          
          # Czytamy logi linijka po linijce
          while read -r line; do
            echo "$line"
          
          # Czytamy logi linijka po linijce
          while read -r line; do
            echo "$line"
            # Dodaliśmy nowy warunek łapiący "build will skip" oraz "no changes detected"
            if [[ "$line" == *"No changes to watched files"* ]] || [[ "$line" == *"no changes detected in watch paths"* ]] || [[ "$line" == *"build will skip"* ]]; then
              echo "=========================================="
              echo "⚠️ Wykryto brak zmian! Przerywam zawieszone CLI."
              echo "=========================================="
              echo "skipped=true" >> $GITHUB_OUTPUT
              SKIPPED=true
              kill -9 $RAILWAY_PID 2>/dev/null || true
              break
            fi
          done < /tmp/railway_pipe
          
          # Sprzątamy potok
          rm -f /tmp/railway_pipe
          
          # Obsługa zakończenia
          if [ "$SKIPPED" = "true" ]; then
             exit 0
          fi
          
          wait $RAILWAY_PID
          if [ $? -ne 0 ]; then
            echo "❌ Wdrożenie Railway zakończyło się błędem."
            exit 1
          fi

      # --- 3. PODSUMOWANIE ---
      - name: Generowanie raportu końcowego
        if: always()
        run: |
          ICON="❌"
          RAILWAY_URL="https://railway.com/project/${{ vars.RAILWAY_PROJECT_ID }}/logs"
          LOG_LINK="$RAILWAY_URL"
          DESC="[Przejdź do logów Railway]($RAILWAY_URL)"

          if [ "${{ steps.deploy.outputs.skipped }}" = "true" ]; then
            ICON="⚠️"
            LOG_LINK="POMINIĘTO (Brak zmian)"
            DESC="Pominięto (Brak zmian w plikach)"
          elif [ "${{ steps.deploy.outcome }}" = "success" ]; then 
            ICON="✅"
          fi

          echo "$ICON deploy - backend --> $LOG_LINK"

          echo "### Wynik wdrożenia Backendu 🚀" >> $GITHUB_STEP_SUMMARY
          echo "$ICON **deploy - backend** --> $DESC" >> $GITHUB_STEP_SUMMARY