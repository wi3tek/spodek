name: Release All (Backend + Frontend) 🚀

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Rodzaj aktualizacji (MAJOR/MINOR/PATCH)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      changelog:
        description: 'Co nowego (zostaw puste dla domyślnego)'
        required: false
        type: string
        default: 'Nowa wersja aplikacji'

jobs:
  # ==========================================
  # ZADANIE 1: PRZYGOTOWANIE WERSJI I COMMIT
  # ==========================================
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Wyliczenie nowej wersji z głównego pliku
        id: prep
        run: |
          OLD_VERSION=$(cat app-version.txt)
          NEW_VERSION=$(npx semver -i ${{ github.event.inputs.bump_type }} $OLD_VERSION)
          
          echo $NEW_VERSION > app-version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Aktualizacja PWA
        run: |
          jq --arg v "${{ env.NEW_VERSION }}" --arg c "${{ github.event.inputs.changelog }}" '.appData.version = $v | .appData.changelog = $c' ./frontend/ngsw-config.json > tmp.json
          mv tmp.json ./frontend/ngsw-config.json

      - name: Commit i Tag
        run: |
          git add app-version.txt ./frontend/ngsw-config.json
          git commit -m "🚀 release: v${{ env.NEW_VERSION }}" -m "${{ github.event.inputs.changelog }}"
          git tag "v${{ env.NEW_VERSION }}"
          git push origin HEAD --follow-tags

  # ==========================================
  # ZADANIE 2: WDROŻENIE BACKENDU (RAILWAY)
  # ==========================================
  deploy-backend:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare-release.outputs.new_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalacja Railway CLI
        run: npm i -g @railway/cli

      - name: Uruchomienie wdrożenia Railway i oczekiwanie na wynik
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service fifowa-spoda-backend

  # ==========================================
  # ZADANIE 3: WDROŻENIE FRONTENDU (RENDER)
  # ==========================================
  deploy-frontend:
    needs: prepare-release
    runs-on: ubuntu-latest
    # Deklaracja wyjścia, aby przekazać link z Render do zadania podsumowującego
    outputs:
      render_url: ${{ steps.deploy.outputs.render_url }}
    steps:
      - name: Uruchomienie wdrożenia i oczekiwanie na wynik (Polling)
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 Rozpoczynam wdrożenie na Renderze..."
          
          TRIGGER_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          DEPLOY_ID=$(echo "$TRIGGER_RESPONSE" | jq -r '.id')
          
          # Zapisujemy adres logów ZANIM wejdziemy w pętlę i przesyłamy go na zewnątrz
          echo "render_url=https://dashboard.render.com/static/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" >> $GITHUB_OUTPUT
          
          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Błąd wyzwalania wdrożenia. Odpowiedź serwera: $TRIGGER_RESPONSE"
            exit 1
          fi
          
          echo "✅ Wdrożenie wystartowało. ID zadania: $DEPLOY_ID"
          echo "⏳ Czekam na zakończenie budowania..."
          
          while true; do
            STATUS_RESPONSE=$(curl -s -X GET \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY")
          
            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')
          
            if [ "$STATUS" = "live" ]; then
              echo "🎉 Wdrożenie zakończone sukcesem!"
              exit 0
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "update_failed" ]; then
              echo "❌ Wdrożenie zakończyło się błędem: $STATUS"
              exit 1
            fi
          
            echo "Deploy status: $STATUS... "
            sleep 10
          done

  # ==========================================
  # ZADANIE 4: WSPÓLNE PODSUMOWANIE WYNIKÓW
  # ==========================================
  summary:
    needs: [deploy-backend, deploy-frontend]
    if: always() # Wymusza uruchomienie nawet w przypadku błędów poprzednich kroków
    runs-on: ubuntu-latest
    steps:
      - name: Generowanie raportu końcowego
        run: |
          # Sprawdzenie statusu backendu
          BACKEND_ICON="❌"
          if [ "${{ needs.deploy-backend.result }}" = "success" ]; then BACKEND_ICON="✅"; fi

          # Sprawdzenie statusu frontendu
          FRONTEND_ICON="❌"
          if [ "${{ needs.deploy-frontend.result }}" = "success" ]; then FRONTEND_ICON="✅"; fi

          # Wypisanie wyniku w konsoli logów (zgodnie z formatem)
          echo "$BACKEND_ICON deploy - backend --> https://railway.com/project/${{ vars.RAILWAY_PROJECT_ID }}/logs"
          echo "$FRONTEND_ICON deploy - frontend --> ${{ needs.deploy-frontend.outputs.render_url }}"

          # Dodatkowy bonus: Wypisanie sformatowanego raportu na głównej stronie "Summary" akcji
          echo "### Wynik wdrożenia 🚀" >> $GITHUB_STEP_SUMMARY
          echo "$BACKEND_ICON **deploy - backend** --> [Przejdź do logów Railway](https://railway.com/project/${{ vars.RAILWAY_PROJECT_ID }}/logs)" >> $GITHUB_STEP_SUMMARY
          echo "$FRONTEND_ICON **deploy - frontend** --> [Przejdź do logów Render](${{ needs.deploy-frontend.outputs.render_url }})" >> $GITHUB_STEP_SUMMARY